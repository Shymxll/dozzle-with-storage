services:
  cert-init:
    image: alpine:3.23
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - |
        apk add --no-cache openssl
        if [ ! -s /certs/dozzle_cert.pem ] || [ ! -s /certs/dozzle_key.pem ]; then
          rm -f /certs/dozzle_cert.pem /certs/dozzle_key.pem /certs/request.csr
          openssl genpkey -algorithm Ed25519 -out /certs/dozzle_key.pem
          openssl req -new -key /certs/dozzle_key.pem -out /certs/request.csr -subj "/C=TR/ST=Istanbul/L=Istanbul/O=Dozzle Archive"
          openssl x509 -req -in /certs/request.csr -signkey /certs/dozzle_key.pem -out /certs/dozzle_cert.pem -days 3650
          chmod 644 /certs/dozzle_cert.pem
          chmod 600 /certs/dozzle_key.pem
        fi
    volumes:
      - dozzle-certs:/certs

  postgres:
    image: postgres:18.4-alpine3.23
    container_name: log-archive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: logarchive
      POSTGRES_USER: ${POSTGRES_USER:-logarchive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  archive:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: log-archive
    restart: unless-stopped
    depends_on:
      cert-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-logarchive}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/logarchive?sslmode=disable
      INGEST_TOKEN: ${INGEST_TOKEN:?INGEST_TOKEN is required}
      DOZZLE_CERT: /certs/dozzle_cert.pem
      DOZZLE_KEY: /certs/dozzle_key.pem
      ARCHIVE_RETENTION_MONTHS: ${ARCHIVE_RETENTION_MONTHS:-6}
      MAX_ROWS_PER_QUERY: ${MAX_ROWS_PER_QUERY:-50000}
      INGEST_MAX_PENDING_ROWS: ${INGEST_MAX_PENDING_ROWS:-100000}
    volumes:
      - dozzle-certs:/certs:ro
    expose:
      - "7007"
      - "8080"

  dozzle:
    image: amir20/dozzle:v10.6.14
    container_name: log-archive-dozzle
    restart: unless-stopped
    depends_on:
      archive:
        condition: service_started
    environment:
      DOZZLE_REMOTE_AGENT: "archive:7007|Arşiv|Arşiv"
      DOZZLE_CERT: /certs/dozzle_cert.pem
      DOZZLE_KEY: /certs/dozzle_key.pem
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle-certs:/certs:ro
    expose:
      - "8080"

  vector:
    image: timberio/vector:0.57.0-alpine
    container_name: log-archive-vector
    restart: unless-stopped
    depends_on:
      archive:
        condition: service_started
    environment:
      INGEST_TOKEN: ${INGEST_TOKEN:?INGEST_TOKEN is required}
      VECTOR_CONFIG: /etc/vector/vector.toml
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector.toml:/etc/vector/vector.toml:ro
      - vector-data:/var/lib/vector

volumes:
  dozzle-certs:
  postgres-data:
  vector-data:
